<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Author Router Test Harness</title>
  <link rel="stylesheet" href="router.css">
  <style>
    body { font-family: Georgia, serif; margin: 0; background: #f6f3ee; color: #222; }
    .toolbar { padding: 1rem 1.5rem; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .toolbar code { background: #f0e9dd; padding: 2px 6px; border-radius: 3px; font-size: 0.85rem; }
    select, button { padding: 0.4rem 0.6rem; font: inherit; }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Router test harness:</strong>
    <span>simulates the Squarespace host page <code>/autoren-detail</code>.</span>
    <label>
      Author:
      <select id="picker"><option>Loading…</option></select>
    </label>
    <span id="status"></span>
  </div>

  <!-- Same mount point that Squarespace's Code Block will host. -->
  <div id="ms-author-mount"></div>

  <script>
    // Tell the router to act as if we are on the host page (we cannot redefine
    // window.location.pathname — Location is a host object).
    window.MS_FORCE_HOST_PAGE = true;
    // Load JSON from the same origin this harness is served from.
    window.MS_CDN_BASE = '.';

    // Populate the picker from index.json so the harness mirrors prod data.
    fetch('authors/index.json').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (idx) {
      var sel = document.getElementById('picker');
      sel.innerHTML = '';
      var qs = new URLSearchParams(window.location.search);
      var current = qs.get('a') || (idx[0] && idx[0].slug);
      idx.sort(function (a, b) { return a.name.localeCompare(b.name); });
      idx.forEach(function (a) {
        var opt = document.createElement('option');
        opt.value = a.slug;
        opt.textContent = a.name;
        if (a.slug === current) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', function () {
        // Avoid full-page reload (which can be blocked inside preview iframes).
        // Update the URL so it's shareable, then drive the router directly.
        history.replaceState(null, '', '?a=' + encodeURIComponent(sel.value));
        if (window.MS_AUTHOR_ROUTER) {
          window.MS_AUTHOR_ROUTER.render(sel.value);
        }
      });
      document.getElementById('status').textContent = idx.length + ' authors loaded';
    }).catch(function (err) {
      document.getElementById('status').textContent = 'index.json load failed: ' + err.message;
      console.error(err);
    });
  </script>
  <script src="router.js" defer></script>
</body>
</html>
